name: Android Build & Release

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Android Build Target'
        required: true
        type: choice
        options:
          - 'debug-apk'
          - 'release-apk'
          - 'release-bundle-aab'
          - 'all'
        default: 'debug-apk'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Debug APK
        if: ${{ github.event_name == 'push' || inputs.build_mode == 'debug-apk' || inputs.build_mode == 'all' }}
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: ${{ inputs.build_mode == 'release-apk' || inputs.build_mode == 'all' }}
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release Bundle (AAB for Google Play)
        if: ${{ inputs.build_mode == 'release-bundle-aab' || inputs.build_mode == 'all' }}
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK Artifact
        if: ${{ github.event_name == 'push' || inputs.build_mode == 'debug-apk' || inputs.build_mode == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeLearn-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: ${{ inputs.build_mode == 'release-apk' || inputs.build_mode == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeLearn-Android-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload Release AAB Bundle (Google Play Store)
        if: ${{ inputs.build_mode == 'release-bundle-aab' || inputs.build_mode == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeLearn-Android-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
