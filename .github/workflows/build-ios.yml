name: iOS Build & Archive

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'package.json'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'iOS Target'
        required: true
        type: choice
        options:
          - 'simulator'
          - 'archive'
        default: 'simulator'

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Setup Xcode Environment
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes | head -n 10

      # Build for iOS Simulator (Unsigned / Direct Testable)
      - name: Build iOS Simulator App
        if: ${{ inputs.target == 'simulator' || github.event_name == 'push' }}
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

      # Package Simulator App into ZIP
      - name: Package Simulator App
        if: ${{ inputs.target == 'simulator' || github.event_name == 'push' }}
        working-directory: ios/App
        run: |
          mkdir -p output
          APP_DIR=$(find build/DerivedData -name "App.app" -type d | head -n 1)
          if [ -d "$APP_DIR" ]; then
            cd "$(dirname "$APP_DIR")"
            zip -r "$GITHUB_WORKSPACE/ios/App/output/TradeLearn-iOS-Simulator.zip" App.app
          fi

      # Build Generic Archive (For App Store / TestFlight / Ad-Hoc if signing keys provided)
      - name: Build iOS Xcode Archive
        if: ${{ inputs.target == 'archive' }}
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Package Xcode Archive
        if: ${{ inputs.target == 'archive' }}
        working-directory: ios/App
        run: |
          mkdir -p output
          if [ -d "build/App.xcarchive" ]; then
            cd build
            zip -r "$GITHUB_WORKSPACE/ios/App/output/TradeLearn-iOS-Archive.xcarchive.zip" App.xcarchive
          fi

      - name: Upload iOS Simulator App Artifact
        if: ${{ inputs.target == 'simulator' || github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeLearn-iOS-Simulator-App
          path: ios/App/output/*.zip
          retention-days: 14

      - name: Upload iOS Archive Artifact
        if: ${{ inputs.target == 'archive' }}
        uses: actions/upload-artifact@v4
        with:
          name: TradeLearn-iOS-Xcode-Archive
          path: ios/App/output/*.xcarchive.zip
          retention-days: 30
